kind: Deployment
apiVersion: apps/v1
metadata:
  name: backend-dp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
        - name: backend-container
          image: back:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
kind: Service
apiVersion: v1
metadata:
  name: backend-service
spec:
  selector:
    app: back
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31217

