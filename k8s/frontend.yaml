kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-dp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: frontend-container
          image: front:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80



---
kind: Service
apiVersion: v1
metadata:
  name: front-service
spec:
  selector:
    app: front
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32201
